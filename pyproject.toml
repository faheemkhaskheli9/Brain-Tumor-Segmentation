[project]
name = "brain-tumor-segmentation"
version = "0.1.0"
description = "U-Net + ResNet-backbone breast ultrasound tumor segmentation notebook (repo name predates a rename; content is breast, not brain)."
requires-python = ">=3.9,<3.11"
dependencies = [
    "numpy>=1.21,<1.24",
    "scipy>=1.9,<2.0",
    "opencv-python-headless>=4.5,<6.0",
    "matplotlib>=3.5,<4.0",
    "tensorflow>=2.9,<2.10",
    "scikit-image>=0.19,<0.20",
    "segmentation-models==1.0.1",
    "image-classifiers==1.0.0",
    "efficientnet==1.0.0",
    "keras-applications>=1.0.8,<1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "packaging>=21.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
